<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bud & Bloom favicon">
  <!-- soft rounded tile -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#FFF9F2"/>
  <!-- subtle inner border -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="none" stroke="#F2E8D5" stroke-width="2"/>

  <!-- leaf -->
  <path
    d="M16 38c0-12 10-22 22-22 7 0 13 2 18 7-2 12-12 25-27 25-6 0-10-4-13-10z"
    fill="#A7C080"
  />
  <!-- leaf vein -->
  <path
    d="M22 40c8-2 18-10 26-20"
    fill="none"
    stroke="#8FA66A"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- little flower -->
  <g transform="translate(40 40)">
    <circle cx="0" cy="0" r="6.5" fill="#F2C6C2"/>
    <circle cx="-6" cy="0" r="5.2" fill="#F2C6C2"/>
    <circle cx="6" cy="0" r="5.2" fill="#F2C6C2"/>
    <circle cx="0" cy="-6" r="5.2" fill="#F2C6C2"/>
    <circle cx="0" cy="6" r="5.2" fill="#F2C6C2"/>
    <circle cx="0" cy="0" r="3.2" fill="#E8C06F"/>
  </g>
</svg>
